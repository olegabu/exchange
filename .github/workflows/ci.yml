name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: exchange

      # docs/spec.md §3.3: sequencer is a sibling checkout, consumed with
      # add_subdirectory until it is packaged. Checked out beside this
      # repo so SEQUENCER_DIR's default (../sequencer) and the presets'
      # VCPKG_MANIFEST_DIR both resolve exactly as on a developer machine.
      - uses: actions/checkout@v4
        with:
          repository: olegabu/sequencer
          path: sequencer

      # g++-10: C++20 <span>; same reason as sequencer's own CI.
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++-10

      # Only for make check-generated (docs/spec.md §3.2): the checked-in
      # SBE headers are what compiles; the JVM proves they are current.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Export GitHub Actions cache variables for vcpkg
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      # Pinned to sequencer's builtin-baseline, for the reason its own
      # ci.yml explains: an unpinned vcpkg checkout brings a newer bundled
      # CMake that rejects flags the baseline's ports still pass.
      - name: Bootstrap vcpkg
        run: |
          baseline=$(jq -r '.["builtin-baseline"]' sequencer/vcpkg.json)
          git clone https://github.com/microsoft/vcpkg.git "$HOME/vcpkg"
          git -C "$HOME/vcpkg" checkout "$baseline"
          "$HOME/vcpkg/bootstrap-vcpkg.sh"
          echo "VCPKG_ROOT=$HOME/vcpkg" >> "$GITHUB_ENV"

      - name: Check vendored and generated sources
        working-directory: exchange
        run: make check

      - name: Configure
        working-directory: exchange
        env:
          VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
        run: cmake --preset debug

      - name: Build
        working-directory: exchange
        run: cmake --build --preset debug

      - name: Test
        working-directory: exchange
        run: ctest --preset debug --output-on-failure
